<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" width="1300" height="900" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif">
  <title>Arquitectura de TripPlanner AI — dos canales independientes</title>
  <desc>Canal 1: Frontend, API Gateway, Lambda y DynamoDB. Canal 2: Frontend, HTTP streaming, AgentCore, Orchestrator y especialistas con MCP.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
    <style>
      .t { fill:#0f172a; font-size:14px; } .tb { fill:#0f172a; font-size:14px; font-weight:700; }
      .s { fill:#475569; font-size:11.5px; } .h { fill:#0f172a; font-size:15px; font-weight:800; letter-spacing:.04em; }
      .lbl { fill:#1e293b; font-size:12px; font-weight:600; }
    </style>
  </defs>
  <rect width="1300" height="900" fill="#f8f9ff"/>
  <text x="650" y="30" text-anchor="middle" class="h" font-size="20" style="font-size:20px">TripPlanner AI — Arquitectura general</text>

  <!-- Usuario y frontend -->
  <rect x="560" y="48" width="180" height="40" rx="20" fill="#e2e8f0" stroke="#64748b"/>
  <text x="650" y="73" text-anchor="middle" class="tb">👤 Usuario (navegador)</text>
  <line x1="650" y1="88" x2="650" y2="112" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="380" y="112" width="540" height="84" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="140" text-anchor="middle" class="tb">Frontend TripPlanner AI · React + Vite</text>
  <text x="650" y="160" text-anchor="middle" class="s">Amazon S3 (privado) + CloudFront (HTTPS, OAC, cabeceras de seguridad/CSP)</text>
  <text x="650" y="178" text-anchor="middle" class="s">Solo contiene URLs e IDs públicos: sin credenciales AWS · no accede a DynamoDB</text>

  <!-- Cognito -->
  <rect x="990" y="112" width="270" height="84" rx="14" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
  <text x="1125" y="140" text-anchor="middle" class="tb">Amazon Cognito</text>
  <text x="1125" y="160" text-anchor="middle" class="s">User Pool + App Client público (SRP)</text>
  <text x="1125" y="178" text-anchor="middle" class="s">Emite el JWT (access token)</text>
  <line x1="920" y1="154" x2="990" y2="154" stroke="#be185d" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="955" y="146" text-anchor="middle" class="lbl">login</text>

  <!-- Paneles de canales -->
  <rect x="30" y="250" width="580" height="470" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="50" y="278" class="h" fill="#1d4ed8" style="fill:#1d4ed8">CANAL 1 · OPERACIONES DE NEGOCIO (REST/JSON)</text>
  <rect x="640" y="250" width="630" height="470" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="660" y="278" class="h" style="fill:#7c3aed">CANAL 2 · INTERACCIÓN AGÉNTICA (HTTP STREAMING)</text>

  <!-- Flechas desde el frontend -->
  <path d="M470 196 C 470 225, 320 225, 320 304" fill="none" stroke="#1d4ed8" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="330" y="232" class="lbl" style="fill:#1d4ed8">HTTPS REST + JWT</text>
  <path d="M830 196 C 830 225, 960 225, 960 304" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrP)"/>
  <text x="850" y="232" class="lbl" style="fill:#7c3aed">HTTP streaming (SSE) + JWT · directo, sin API Gateway</text>

  <!-- Canal 1 -->
  <rect x="60" y="304" width="520" height="72" rx="12" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="320" y="330" text-anchor="middle" class="tb">Amazon API Gateway (HTTP API)</text>
  <text x="320" y="350" text-anchor="middle" class="s">Autorizador JWT de Cognito · CORS restringido · throttling 20 rps (ráfaga 40)</text>
  <text x="320" y="366" text-anchor="middle" class="s">/me · /dashboard · /trips · /trips/{id}/itinerary · /reservations · /wallet · /purchases · /fx · /transport</text>

  <g>
    <rect x="60" y="410" width="160" height="46" rx="10" fill="#fff" stroke="#1d4ed8"/><text x="140" y="430" text-anchor="middle" class="tb">λ me</text><text x="140" y="446" text-anchor="middle" class="s">perfil · prefs · dashboard</text>
    <rect x="240" y="410" width="160" height="46" rx="10" fill="#fff" stroke="#1d4ed8"/><text x="320" y="430" text-anchor="middle" class="tb">λ trips</text><text x="320" y="446" text-anchor="middle" class="s">CRUD viajes · presupuesto</text>
    <rect x="420" y="410" width="160" height="46" rx="10" fill="#fff" stroke="#1d4ed8"/><text x="500" y="430" text-anchor="middle" class="tb">λ itineraries</text><text x="500" y="446" text-anchor="middle" class="s">itinerario por día</text>
    <rect x="60" y="470" width="160" height="46" rx="10" fill="#fff" stroke="#1d4ed8"/><text x="140" y="490" text-anchor="middle" class="tb">λ reservations</text><text x="140" y="506" text-anchor="middle" class="s">estados · reasociar</text>
    <rect x="240" y="470" width="160" height="46" rx="10" fill="#fff" stroke="#1d4ed8"/><text x="320" y="490" text-anchor="middle" class="tb">λ wallet</text><text x="320" y="506" text-anchor="middle" class="s">saldo · compra atómica</text>
    <rect x="420" y="470" width="160" height="46" rx="10" fill="#fff" stroke="#1d4ed8"/><text x="500" y="490" text-anchor="middle" class="tb">λ utils</text><text x="500" y="506" text-anchor="middle" class="s">divisas · bus vs avión</text>
  </g>
  <line x1="320" y1="376" x2="320" y2="408" stroke="#1d4ed8" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="60" y="540" class="s">Cada Lambda valida entradas y toma el usuario del JWT (claim sub) · rol IAM propio de mínimo privilegio</text>

  <rect x="60" y="570" width="300" height="110" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="210" y="598" text-anchor="middle" class="tb">Amazon DynamoDB · tripplanner-main</text>
  <text x="210" y="618" text-anchor="middle" class="s">Tabla única · PK USER#sub · SK PROFILE | PREFS | WALLET</text>
  <text x="210" y="634" text-anchor="middle" class="s">TRIP# | ITIN# | RES# | TXN# · cifrada · PITR</text>
  <text x="210" y="656" text-anchor="middle" class="s">Fuente de verdad de usuarios, preferencias,</text>
  <text x="210" y="670" text-anchor="middle" class="s">viajes, itinerarios, reservas y movimientos</text>
  <path d="M140 516 L 140 570" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M320 516 L 320 570" stroke="#15803d" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="390" y="570" width="190" height="110" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/>
  <text x="485" y="598" text-anchor="middle" class="tb">APIs públicas</text>
  <text x="485" y="620" text-anchor="middle" class="s">open.er-api.com (divisas)</text>
  <text x="485" y="636" text-anchor="middle" class="s">Open-Meteo Geocoding</text>
  <path d="M500 516 L 500 570" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>

  <!-- Canal 2 -->
  <rect x="670" y="304" width="570" height="84" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="955" y="330" text-anchor="middle" class="tb">Amazon Bedrock AgentCore Runtime · Orchestrator Agent</text>
  <text x="955" y="350" text-anchor="middle" class="s">Strands Agents (HTTP) · autorizador JWT de Cognito · modelo Gemini · memoria por usuario</text>
  <text x="955" y="368" text-anchor="middle" class="s">interpreta · decide · coordina · 12 tools de negocio + 3 especialistas</text>

  <path d="M800 388 L 750 446" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
  <path d="M955 388 L 940 446" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
  <path d="M1110 388 L 1130 446" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
  <text x="662" y="425" class="lbl" style="fill:#7c3aed">A2A + SigV4</text>

  <g>
    <rect x="665" y="446" width="170" height="64" rx="12" fill="#fff" stroke="#7c3aed"/><text x="750" y="472" text-anchor="middle" class="tb">Flights Agent</text><text x="750" y="492" text-anchor="middle" class="s">A2A · especialista en vuelos</text>
    <rect x="855" y="446" width="170" height="64" rx="12" fill="#fff" stroke="#7c3aed"/><text x="940" y="472" text-anchor="middle" class="tb">Weather Agent</text><text x="940" y="492" text-anchor="middle" class="s">A2A · especialista en clima</text>
    <rect x="1045" y="446" width="170" height="64" rx="12" fill="#fff" stroke="#7c3aed"/><text x="1130" y="472" text-anchor="middle" class="tb">Hotels Agent</text><text x="1130" y="492" text-anchor="middle" class="s">A2A · especialista en hoteles</text>
  </g>
  <g stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)">
    <line x1="750" y1="510" x2="750" y2="546"/><line x1="940" y1="510" x2="940" y2="546"/><line x1="1130" y1="510" x2="1130" y2="546"/>
  </g>
  <g>
    <rect x="665" y="546" width="170" height="56" rx="12" fill="#fef9c3" stroke="#a16207"/><text x="750" y="570" text-anchor="middle" class="tb">MCP de vuelos</text><text x="750" y="587" text-anchor="middle" class="s">FlightPowers · Google Flights</text>
    <rect x="855" y="546" width="170" height="56" rx="12" fill="#fef9c3" stroke="#a16207"/><text x="940" y="570" text-anchor="middle" class="tb">MCP de clima</text><text x="940" y="587" text-anchor="middle" class="s">mcp-weather-server · Open-Meteo</text>
    <rect x="1045" y="546" width="170" height="56" rx="12" fill="#fef9c3" stroke="#a16207"/><text x="1130" y="570" text-anchor="middle" class="tb">MCP de hoteles</text><text x="1130" y="587" text-anchor="middle" class="s">Staylist World</text>
  </g>
  <rect x="665" y="622" width="550" height="82" rx="12" fill="#fff" stroke="#7c3aed" stroke-dasharray="6 4"/>
  <text x="940" y="644" text-anchor="middle" class="tb">Servicios de AgentCore y modelo</text>
  <text x="940" y="664" text-anchor="middle" class="s">Memory (preferencias · resúmenes · hechos) · Identity (credenciales Gemini y FlightPowers)</text>
  <text x="940" y="682" text-anchor="middle" class="s">Gateway MCP (CUSTOM_JWT) → Lambda TravelTips · Gemini API</text>
  <text x="940" y="698" text-anchor="middle" class="s">Memoria conversacional ≠ persistencia: DynamoDB es la fuente de verdad</text>

  <!-- Tools de negocio: el Orchestrator usa la misma API (JWT del usuario) -->
  <path d="M670 346 L 580 346" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrP)"/>
  <text x="625" y="335" text-anchor="middle" class="lbl" style="fill:#7c3aed;font-size:10.5px">Tools de</text>
  <text x="625" y="365" text-anchor="middle" class="lbl" style="fill:#7c3aed;font-size:10.5px">negocio</text>
  <text x="620" y="740" text-anchor="middle" class="s" style="font-size:12px">Las Tools del Orchestrator (create_trip, get_trips, update_trip, create_itinerary, update_itinerary, create_reservation, get_reservations, update_reservation, …)</text>
  <text x="620" y="757" text-anchor="middle" class="s" style="font-size:12px">llaman a la API de negocio con el JWT del usuario: Tool → API Gateway → Lambda → DynamoDB. El agente decide; la Lambda valida y ejecuta.</text>

  <!-- IAM -->
  <rect x="30" y="780" width="1240" height="40" rx="10" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="650" y="805" text-anchor="middle" class="tb">IAM · roles y políticas de mínimo privilegio para cada Lambda, cada agente, API Gateway y S3 · CloudWatch Logs</text>

  <!-- Leyenda -->
  <g font-size="12">
    <rect x="30" y="842" width="16" height="16" fill="#fef3c7" stroke="#d97706"/><text x="52" y="855" class="s">Frontend / hosting</text>
    <rect x="190" y="842" width="16" height="16" fill="#dbeafe" stroke="#1d4ed8"/><text x="212" y="855" class="s">Canal 1 · backend serverless</text>
    <rect x="400" y="842" width="16" height="16" fill="#ede9fe" stroke="#7c3aed"/><text x="422" y="855" class="s">Canal 2 · capa agéntica</text>
    <rect x="590" y="842" width="16" height="16" fill="#dcfce7" stroke="#15803d"/><text x="612" y="855" class="s">Datos</text>
    <rect x="670" y="842" width="16" height="16" fill="#fef9c3" stroke="#a16207"/><text x="692" y="855" class="s">MCP</text>
    <rect x="750" y="842" width="16" height="16" fill="#fce7f3" stroke="#be185d"/><text x="772" y="855" class="s">Autenticación</text>
    <rect x="880" y="842" width="16" height="16" fill="#fee2e2" stroke="#b91c1c"/><text x="902" y="855" class="s">Seguridad (IAM)</text>
    <text x="1030" y="855" class="s">Las flechas indican la dirección de la petición.</text>
  </g>
  <text x="30" y="885" class="s">API Gateway NO interviene en el canal de streaming: el navegador invoca AgentCore directamente con el JWT de Cognito (el endpoint admite CORS).</text>
</svg>
